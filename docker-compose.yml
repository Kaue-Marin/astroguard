version: '3.8'

services:
  backend:
    image: php:8.2-apache
    container_name: astroguard-api
    ports:
      - "8000:80" 
    volumes:
      - ./backend:/var/www/html
    working_dir: /var/www/html

  frontend:
    image: node:20-alpine
    container_name: astroguard-web
    ports:
      - "5173:5173" 
    volumes:
      - ./frontend:/app
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"